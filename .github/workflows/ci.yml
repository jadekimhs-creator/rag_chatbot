name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Build Docker image (Dry Run)
      run: docker build -t rag-chatbot:latest .
      
    # 참고: 향후 이 부분에 Render 등 PaaS 배포 Webhook 호출이나 
    # SSH 접속 후 서버 배포 스크립트를 추가할 수 있습니다.
